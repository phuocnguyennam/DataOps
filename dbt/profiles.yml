# DBT connection profiles.
#
# Connection settings are injected via environment variables so the SAME project
# runs locally (Docker) and in GitHub Actions (CI/CD) without hardcoding secrets.
# Every value has a sensible local default; override them through GitHub
# Environments' secrets (see DEPLOYMENT.md) or a local .env file.
#
# Targets:
#   dev  -> development SQL Server (used locally and by the `develop` branch)
#   prod -> production SQL Server (used only by the `main` branch)
#
# Both targets read the SAME environment variable names. In CI/CD the values are
# supplied by the matching GitHub Environment (`dev` or `prod`) via secrets, so
# the active target decides which server is used:
#   DBT_TARGET, DBT_SQLSERVER_HOST, DBT_SQLSERVER_DATABASE,
#   DBT_SCHEMA, DBT_SQLSERVER_USER, DBT_SQLSERVER_PASSWORD
#
# Select a target explicitly with:   dbt <cmd> --target <name>
# or set the DBT_TARGET environment variable.

dbt_airflow_project:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 17 for SQL Server'
      server: "{{ env_var('DBT_SQLSERVER_HOST', 'sqlserver') }}"
      port: 1433
      database: "{{ env_var('DBT_SQLSERVER_DATABASE', 'AdventureWorks2014') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbo') }}"
      user: "{{ env_var('DBT_SQLSERVER_USER', 'imrandbtnew') }}"
      password: "{{ env_var('DBT_SQLSERVER_PASSWORD', 'Imran@12345') }}"
      windows_login: False
      encrypt: False
      trust_cert: True
      threads: 4  # Number of concurrent operations
      timeout_seconds: 300  # Query timeout in seconds
      retries: 3  # Number of retries for failed operations
      authentication: sql  # Explicitly specify SQL authentication
      keepalives_idle: 0  # Disable keepalive to prevent connection issues
      application_name: dbt_airflow_project  # Identify the application in SQL Server
      retry_on_error: True  # Enable automatic retries on transient errors

    prod:
      type: sqlserver
      driver: 'ODBC Driver 17 for SQL Server'
      server: "{{ env_var('DBT_SQLSERVER_HOST', 'sqlserver') }}"
      port: 1433
      database: "{{ env_var('DBT_SQLSERVER_DATABASE', 'AdventureWorks2014') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbo') }}"
      user: "{{ env_var('DBT_SQLSERVER_USER', 'imrandbtnew') }}"
      password: "{{ env_var('DBT_SQLSERVER_PASSWORD', 'Imran@12345') }}"
      windows_login: False
      encrypt: False
      trust_cert: True
      threads: 4  # Number of concurrent operations
      timeout_seconds: 300  # Query timeout in seconds
      retries: 3  # Number of retries for failed operations
      authentication: sql  # Explicitly specify SQL authentication
      keepalives_idle: 0  # Disable keepalive to prevent connection issues
      application_name: dbt_airflow_project  # Identify the application in SQL Server
      retry_on_error: True  # Enable automatic retries on transient errors
