name: Rollback

# Manual rollback — re-deploys a previous known-good version of the DBT models
# to a chosen environment. Two complementary strategies are supported:
#
#   Strategy A (default): "State-aware rollback" using dbt state.
#       Compares the last successful run (stored in the target's `manifest.json`
#       artifact) against the rollback ref and reverts only what changed.
#
#   Strategy B: "Full redeploy" of a previous git ref.
#       Checks out `ref` (tag / branch / commit) and runs the models from there.
#
# See DEPLOYMENT.md -> "Rollback procedures" for the full runbook.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to roll back'
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      ref:
        description: 'Git ref to roll back to (tag, branch, or commit SHA), e.g. v1.0.0'
        type: string
        required: true
      strategy:
        description: 'Rollback strategy'
        type: choice
        required: true
        default: state-aware
        options:
          - state-aware
          - full-redeploy

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment }}
    env:
      DBT_TARGET: ${{ github.event.inputs.environment }}
      DBT_SQLSERVER_HOST: ${{ secrets.DBT_SQLSERVER_HOST }}
      DBT_SQLSERVER_DATABASE: ${{ secrets.DBT_SQLSERVER_DATABASE }}
      DBT_SQLSERVER_USER: ${{ secrets.DBT_SQLSERVER_USER }}
      DBT_SQLSERVER_PASSWORD: ${{ secrets.DBT_SQLSERVER_PASSWORD }}
      DBT_SCHEMA: ${{ secrets.DBT_SCHEMA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Microsoft ODBC Driver 17 + dbt
        run: |
