          pip install dbt-sqlserver==1.8.7

      - name: Install DBT dependencies
        working-directory: dbt
        run: dbt deps --target "${{ github.event.inputs.environment }}"

      - name: Download prior state (state-aware rollback)
        id: state
        if: github.event.inputs.strategy == 'state-aware'
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifacts-${{ github.event.inputs.environment }}
          path: dbt/state
        continue-on-error: true

      - name: State-aware rollback (revert changed models)
        if: github.event.inputs.strategy == 'state-aware'
        working-directory: dbt
        run: |
          if [ -f state/manifest.json ]; then
            dbt run --target "${{ github.event.inputs.environment }}" \
              --select state:modified+ --defer --state state
            dbt test --target "${{ github.event.inputs.environment }}" \
              --select state:modified+ --defer --state state
          else
            echo "::warning::No prior state artifact found; falling back to full redeploy."
            dbt run --target "${{ github.event.inputs.environment }}" --full-refresh
            dbt test --target "${{ github.event.inputs.environment }}"
          fi

      - name: Full redeploy rollback (run models from the target ref)
        if: github.event.inputs.strategy == 'full-redeploy'
        working-directory: dbt
        run: |
          dbt run --target "${{ github.event.inputs.environment }}" --full-refresh
          dbt test --target "${{ github.event.inputs.environment }}"

      - name: Rollback summary
        if: always()
        run: |
          {
            echo "# Rollback report"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | \`${{ github.event.inputs.environment }}\` |"
            echo "| Rollback ref | \`${{ github.event.inputs.ref }}\` |"
            echo "| Strategy | \`${{ github.event.inputs.strategy }}\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
