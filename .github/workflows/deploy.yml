name: Deploy

# Continuous Deployment — automatically deploys the DBT pipeline when code is
# merged to a protected branch:
#   push to `develop` -> deploy to the `dev` target
#   push to `main`     -> deploy to the `prod` target (with backup + health checks)
#
# Two database modes (choose via `db-mode`):
#   external  (default) - connects to a REAL SQL Server supplied through GitHub
#                         Environments' secrets (dev/prod). Used for actual
#                         environment-specific deployments.
#   container - spins up a THROWAWAY SQL Server service container inside the
#               runner, restores AdventureWorks2014 into it, deploys, and discards
#               it. Fully self-contained: no external server required. Ideal for
#               demonstrating the CD flow without any infrastructure.
#
# Environment secrets for `external` mode (Settings -> Environments -> dev/prod,
# SAME secret names in each):
#   DBT_SQLSERVER_HOST, DBT_SQLSERVER_DATABASE, DBT_SQLSERVER_USER,
#   DBT_SQLSERVER_PASSWORD, DBT_SCHEMA
# Optional repo-level secret for notifications: SLACK_WEBHOOK_URL.
#
# For `push` events the mode defaults to `external`; override it with the repo
# variable DEPLOY_DB_MODE (Settings -> Secrets and variables -> Actions -> Variables).

on:
  push:
    branches:
      - develop
      - main
